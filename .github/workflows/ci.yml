name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: nmps-ci-only-secret-not-for-production-0123456789
      AUTH_URL: http://localhost:3000
      DEFAULT_SCHOOL_ID: ci-school
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build