name: Production uptime and database readiness

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nmps-production-uptime
  cancel-in-progress: true

jobs:
  probe:
    name: Non-mutating production health probe
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify liveness and database readiness
        shell: bash
        env:
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "$PRODUCTION_BASE_URL" ]]; then
            echo "::warning::Monitoring has not run: set PRODUCTION_BASE_URL in GitHub Settings > Environments > production."
            echo "## NMPS production uptime probe" >> "$GITHUB_STEP_SUMMARY"
            echo "- Status: not configured; no production requests were made." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$PRODUCTION_BASE_URL" != https://* ]]; then
            echo "::error::PRODUCTION_BASE_URL must be HTTPS."
            exit 1
          fi
          BASE="${PRODUCTION_BASE_URL%/}"
          HEALTH="$(curl --fail --silent --show-error --max-time 15 "$BASE/api/health")"
          echo "$HEALTH" | jq -e '.status == "ok"' >/dev/null
          READY="$(curl --fail --silent --show-error --max-time 20 "$BASE/api/ready")"
          echo "$READY" | jq -e '.status == "ready" and .database == "connected"' >/dev/null
          {
            echo "## NMPS production uptime probe"
            echo "- Checked at (UTC): $(date -u +'%Y-%m-%d %H:%M:%S')"
            echo "- Liveness endpoint: passed"
            echo "- MongoDB readiness endpoint: passed"
          } >> "$GITHUB_STEP_SUMMARY"
